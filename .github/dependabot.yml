# Dependency update policy.
#
# ================================= PAUSED =================================
# EVERY ECOSYSTEM BELOW HAS open-pull-requests-limit SET TO 0, WHICH DISABLES VERSION
# UPDATES. No Dependabot pull requests will be raised.
#
# Why: the grouping worked -- 14 individual PRs became 8 grouped ones -- but what
# remained were three MAJOR-version migrations that no amount of rebasing turns
# green, and they sat at the top of the queue:
#
#   React 18 -> 19 and react-router-dom 6 -> 7
#   TypeScript 5.6 -> 7.0, Vite 5 -> 8, Vitest 2 -> 5, plugin-react 4 -> 6
#   node:22-alpine -> node:26-alpine
#
# Those are migrations, not bumps. Each wants its own deliberate piece of work.
# Paused rather than deleted so the groups, limits and copyleft ignores below
# survive for whoever re-enables it; see "To resume" at the foot of this file.
#
# THIS DOES NOT TOUCH DEPENDABOT SECURITY UPDATES OR ALERTS, which are repository
# settings (Settings -> Code security), not this file. Vulnerability alerts keep
# arriving. That is deliberate: pausing routine upgrades is a workload decision,
# turning off security notification is not.
# ==========================================================================
#
# THE GOAL IS A SMALL NUMBER OF REVIEWABLE PRs, NOT A LARGE NUMBER OF PRECISE ONES.
# The first version of this file grouped only the dependencies that obviously move together and
# left everything else ungrouped -- which means one PR per package. With 29 pip dependencies and
# 15 npm ones that produced 13 open PRs in a week, and 13 PRs nobody reviews is worse for security
# than 4 that somebody does.
#
# Every ecosystem below therefore ends with a catch-all `rest` group. Dependabot assigns a
# dependency to the FIRST group whose patterns match, so the named groups above it still win and
# `rest` collects the remainder into one PR instead of twenty.
#
# SECURITY UPDATES ARE NOT AFFECTED by open-pull-requests-limit and are raised separately, so
# tightening the limits here does not delay a vulnerability fix.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Monthly, not weekly. Grouping fixes how MANY PRs arrive; cadence fixes how OFTEN. Security
      # updates ignore this schedule and are raised as soon as an advisory lands, so a slower
      # version-update cadence costs nothing in exposure.
      interval: monthly
    open-pull-requests-limit: 0  # PAUSED (was 3)
    groups:
      # The ML stack moves together and a torch bump without the matching transformers bump is
      # usually not what you want. Reviewing them separately wastes everyone's time.
      ml:
        patterns: ["torch", "transformers", "accelerate", "peft", "bitsandbytes", "fair-esm"]
      google:
        patterns: ["google-*"]
      rest:
        patterns: ["*"]
    ignore:
      # Never propose these. They are copyleft and deliberately absent; a Dependabot PR adding
      # one back would fail tests/test_licensing.py, but it should not be proposed at all.
      - dependency-name: "propy3"
      - dependency-name: "s4pred"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0  # PAUSED (was 3)
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react*"]
      tooling:
        patterns: ["vite", "vitest", "typescript", "@vitejs/*", "@testing-library/*"]
      rest:
        patterns: ["*"]

  # One PR for all workflow actions. They are independent of each other and of the code, so there
  # is nothing to be learned from reviewing them one at a time.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0  # PAUSED (was 1)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0  # PAUSED (was 1)
    groups:
      images:
        patterns: ["*"]

# ---------------------------------------------------------------------------
# To resume: restore each `open-pull-requests-limit` to the value noted beside
# it, and decide first what to do about major versions. The straightforward
# option is to stop proposing them at all:
#
#     ignore:
#       - dependency-name: "*"
#         update-types: ["version-update:semver-major"]
#
# KNOW THE TRADE BEFORE ADOPTING IT: `ignore` also suppresses SECURITY updates
# for the ignored versions, so a CVE fixed only in a new major would not be
# proposed. Narrowing it to npm and docker -- a build-time toolchain and a base
# image -- while leaving pip majors visible keeps that exposure off the runtime.
# ---------------------------------------------------------------------------
