# Three jobs, per the build spec: python, web, images.
#
# The backend suite cannot be green (four stale test_api_e2e expectations, three tests needing
# model weights; see docs/BASELINE.md), so the python job compares its OUTCOME to the recorded
# baseline instead of requiring a zero exit. A new failure fails CI; so does a new pass, because
# that means the baseline is stale.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the accounts service and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r services/accounts/requirements.txt pytest pyyaml

      - name: Accounts suite
        # Must be green. Every one of these is a guard on the only route to an API with no
        # authentication of its own. WEB_CONCURRENCY=2 because shared state in a module-level
        # dict passes in one process and fails behind two workers.
        env:
          WEB_CONCURRENCY: "2"
        run: pytest -q services/accounts/tests

      - name: Install the job API's runtime
        run: pip install -r deploy/api.requirements.txt

      - name: Install what the backend suite imports beyond the API's own runtime
        # THE WHOLE of requirements.txt, with the CPU PyTorch index. This step used to install
        # only structlog and pandas, on the stated grounds that "nothing in the collectable suite
        # needs torch, transformers, sklearn or xgboost, because the 47 tests that would are
        # uncollectable anyway (s4pred)". Making s4pred an optional import removed exactly that
        # barrier: pipeline/__init__.py imports stage 5 eagerly, stage 5 imports torch at module
        # level, and those 47 tests now collect and need the real ML stack. The slim install then
        # produced 34 passed / 6 failed / 2 errors and the baseline check called it a regression.
        #
        # Reproducing the recorded baseline needs effectively all of requirements.txt -- verified
        # by building this exact environment from scratch, which lands on 82/7/0. The CPU index
        # matters: the default torch wheel is the CUDA build. The worker Dockerfiles select the
        # CUDA wheel themselves and are unaffected. ~2.4 GB installed, amortised by the pip cache.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: OpenAPI snapshot is current
        # Generated types are built from this snapshot; if it drifts from api.py the web app's
        # types describe an API that no longer exists.
        run: python web/scripts/openapi.py peptide --check

      - name: Backend suite matches the recorded baseline
        env:
          DEV_MODE: "true"
        run: python .github/check_baseline.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Generated types match the snapshot
        # Regenerate and fail on any diff, so a field renamed in api.py cannot reach the browser
        # as an undefined.
        run: |
          npm run api:types
          git diff --exit-code -- src/api/peptide.gen.ts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build every image
        # A placeholder key: compose refuses to start without ACCOUNTS_SECRET_KEY, and the other
        # settings are only read at run time, so building needs nothing real.
        env:
          ACCOUNTS_SECRET_KEY: ci-placeholder-key-at-least-32-bytes-long-xxxxx
          VERTEX_CLOUD_PROJECT: ci
          VERTEX_LOCATION: ci
          VERTEX_ARTIFACTS_DIR: gs://ci/artifacts
          VERTEX_MODEL_STORE: gs://ci/model_weights
          SEED_CANDIDATES_FILE: gs://ci/seeds.fasta
          WORKER_IMAGE_URI: ci/worker:latest
          WORKER_SERVICE_ACCOUNT: ci@ci.iam.gserviceaccount.com
          MACHINE_TYPE: g2-standard-4
          ACCELERATOR_TYPE: NVIDIA_L4
          ACCELERATOR_COUNT: "1"
        run: docker compose -f deploy/compose.yaml build
