stages:
  s01_therapeutic_product_brief:
    enabled: true
    params:
      # Local/dev only (DEV_MODE=true): a file path, not inline JSON.
      # Deployment (worker.py) always receives the brief inline instead.
      brief_path: ./data/briefs/TC-01_infected_diabetic_foot_ulcer.json
  s02_wound_biology_and_targets:
    enabled: true
    params:
      deficit_rules_path: ./configs/deficit_rules.config.yaml
      input: null
  s03_data_integration:
    enabled: false
    params:
      input: null                       # path to .jsonl when entering mid-pipeline
  s04_candidate_generation:
    enabled: true
    params:
      tags: ["<AMP>", "<ANTIBACTERIAL>"]
      n_peptides: 100
      max_new_tokens: 120
      batch_size: 16
      max_attempts: 20
      generator: null
      input: null
      route_a_ga_params:
        pop_size: 3
        n_generations: 5
        mutation_rate: 0.1
        random_seed: 42
      # min_length/max_length come from the Stage 1 brief, not here.
      route_a_constraint_config:
        charge_min: -3.0
        charge_max: 8.0
        hydro_min: -1.0
        hydro_max: 1.0
        aggregation_threshold: 3.0
        ph: 7.4
  s05_physchem_screening:
    enabled: true
    params:
      ph: 7.4
      solubility_solvent: Ultrapure water
      aggregation_tendency_flag_max: 0.75
      solubility_flag_min: 0.30
      amphipathicity_flag_max: 0.8
      isoelectric_point_flag_ph_window: 0.5
      ss_confidence_unstable_max: 0.5
      ss_confidence_ambiguous_max: 0.7
      risk_category_low_max: 0
      risk_category_medium_max: 2

  s06_functional_models:
    enabled: true
    params:
      stage6_thresholds:
        min_amp_probability: 0.7
        min_proliferation_migration: 0.5
        min_angiogenic_activity: 0.1
        min_anti_inflammatory_probability: 0.5
        max_mic:
          MRSA: 32.0
          Pseudomonas_aeruginosa: 32.0
          Staphylococcus_aureus: 32.0
        max_mbic:
          MRSA: 32.0
          Pseudomonas_aeruginosa: 32.0
          Staphylococcus_aureus: 32.0


  s07_structure_mechanism:
    enabled: true
    params:
      plddt_low_confidence_max: 0.5
      pathway_engagement_min_probability: 0.5
      helix_phi_min: -100.0
      helix_phi_max: -30.0
      helix_psi_min: -77.0
      helix_psi_max: -5.0
      sheet_phi_min: -180.0
      sheet_phi_max: -45.0
      sheet_psi_min: 90.0
      sheet_psi_max: 180.0

  s08_safety_developability:
    enabled: true
    params:
      hemolysis_phc50_reject_max: 4.0
      solubility_solvent: Ultrapure water
      cytotoxicity_cell_type: DRAMP_aggregate
      cytotoxicity_reject_max: 0.5
      aggregation_reject_max: 0.7
      solubility_flag_min: 0.3
      cleavage_stability_reject_min: 0.3
      cleavage_decay_rate: 0.5
      # wound_protease_accessions: null   # unset -> WOUND_PROTEASE_ACCESSIONS panel

  s09_synthesis_cmc:
    enabled: true
    params:
      rejected_difficulty_classes: ["high"]

  s11_ranking:
    enabled: true
    params: {}
