stages:
  s01_therapeutic_product_brief:
    enabled: true
    params:
      brief_path: ./data/briefs/TC-01_infected_diabetic_foot_ulcer.json
  s02_wound_biology_and_targets:
    enabled: true
    params:
      deficit_rules_path: ./configs/deficit_rules.config.yaml
      input: null
  s03_data_integration:
    enabled: false
    params:
      input: null                       # path to .jsonl when entering mid-pipeline
  s04_candidate_generation:
    enabled: true
    params:
      tags: ["<AMP>"]
      n_peptides: 100
      min_length: 6
      max_length: 35
      max_new_tokens: 120
      batch_size: 16
      max_attempts: 20
      generator: null
      input: null
      route_a_ga_params:
        pop_size: 3
        n_generations: 5
        mutation_rate: 0.1
        random_seed: 42
      # Route A hard-reject thresholds (physicochemical_filter / ConstraintConfig).
      # min_length/max_length above take precedence if also set there.
      route_a_constraint_config:
        charge_min: -3.0
        charge_max: 8.0
        hydro_min: -1.0
        hydro_max: 1.0
        aggregation_threshold: 3.0
        ph: 7.4
  s05_physchem_screening:
    enabled: true
    params:
      ph: 7.4
      solubility_solvent: Ultrapure water
      aggregation_tendency_flag_max: 0.75
      solubility_flag_min: 0.30
      amphipathicity_flag_max: 0.8
      isoelectric_point_flag_ph_window: 0.5
      ss_confidence_unstable_max: 0.5
      ss_confidence_ambiguous_max: 0.7
      risk_category_low_max: 0
      risk_category_medium_max: 2

  s06_functional_models:
    enabled: true
    params:
      stage6_thresholds:
        min_amp_probability: 0.8
        min_proliferation_migration: 0.5
        min_angiogenic_activity: 0.1
        min_anti_inflammatory_probability: 0.5
        max_mic:
          MRSA: 16.0
          Pseudomonas_aeruginosa: 16.0
          Staphylococcus_aureus: 16.0
        max_mbic:
          MRSA: 32.0
          Pseudomonas_aeruginosa: 32.0
          Staphylococcus_aureus: 32.0


  s07_structure_mechanism:
    enabled: true
    params:
      plddt_low_confidence_max: 0.5
      pathway_engagement_min_probability: 0.5
      helix_phi_min: -100.0
      helix_phi_max: -30.0
      helix_psi_min: -77.0
      helix_psi_max: -5.0
      sheet_phi_min: -180.0
      sheet_phi_max: -45.0
      sheet_psi_min: 90.0
      sheet_psi_max: 180.0

  s08_safety_developability:
    enabled: true
    params:
      cytotoxicity_reject_max: 0.5
      hemolysis_phc50_reject_max: 4.0
      cleavage_decay_rate: 0.5
      hemolysis_predictor_version: "v1"

  s09_synthesis_cmc:
    enabled: true
    params:
      max_length: 35
      rejected_difficulty_classes: ["high"]

  s11_ranking:
    enabled: true
    params:
    # Unconfigurable parameters are set in the ranking_config.yaml file
      ranking_config:
        baseline_weights:
          wound_closure: 0.22
          antimicrobial: 0.18
          immunomodulation: 0.13
          angiogenesis: 0.12
          collagen_ecm: 0.10
          safety: 0.12
          stability: 0.08
          synthesis_feasibility: 0.03
          mechanistic_confidence: 0.02

        modifier_rules:
          - reason: antimicrobial_objective
            field: desired_functions
            any_of: [antimicrobial, antimicrobial_action, "antimicrobial action"]
            modifiers: {antimicrobial: 1.25}
          - reason: migration_objective
            field: desired_functions
            any_of: [keratinocyte_migration, fibroblast_migration, "cell proliferation/migration"]
            modifiers: {wound_closure: 1.25}
          - reason: angiogenesis_objective
            field: desired_functions
            any_of: [angiogenesis]
            modifiers: {angiogenesis: 1.25}
          - reason: immunomodulation_objective
            field: desired_functions
            any_of: [anti_inflammatory, immunomodulation]
            modifiers: {immunomodulation: 1.25}
          - reason: collagen_objective
            field: desired_functions
            any_of: [collagen_remodeling, collagen_synthesis, "collagen synthesis"]
            modifiers: {collagen_ecm: 1.25}
          - reason: infected_wound
            field: wound_context
            any_of: [infected]
            modifiers: {antimicrobial: 1.25, immunomodulation: 1.15}
          - reason: diabetic_or_chronic_wound
            field: wound_context
            any_of: [diabetic, chronic, high_glucose]
            modifiers: {wound_closure: 1.20, angiogenesis: 1.20, immunomodulation: 1.15, stability: 1.20}
          - reason: clean_surgical_wound
            field: wound_context
            all_of: [clean, surgical]
            none_of: [infected]
            modifiers: {wound_closure: 1.20, collagen_ecm: 1.25, angiogenesis: 1.15, antimicrobial: 0.75}
        normalizers:
          safety:
            kind: probability
            higher_is_better: false
        input_sources:
          scores:
            antimicrobial: amp_probability
            immunomodulation: anti_inflammatory_probability
            angiogenesis: angiogenic_activity.angiogenic
            wound_closure: proliferation_migration.migration
            safety: cytotoxicity.score
            stability: cleavage_stability.score
            synthesis_feasibility: synthesis_feasibility.ml_feasibility_prior.score
            mechanistic_confidence: mechanism.structural_confidence