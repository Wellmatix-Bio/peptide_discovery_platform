<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wellmatix | Food-to-Product R&D</title><style>
:root{--bg:#f4f7fb;--paper:#fff;--ink:#182638;--muted:#627389;--line:#dce4ee;--nav:#10263d;--blue:#2563eb;--teal:#087e78;--amber:#a35a00;--red:#b42332}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.48 Inter,system-ui,Segoe UI,sans-serif}header{background:var(--nav);color:white;padding:20px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}header h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:#b8c8d9}.pill{border:1px solid #7890a9;border-radius:20px;padding:5px 11px;font-size:11px}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{background:#18324c;padding:16px 10px;color:#eaf2fa}aside button{display:block;width:100%;border:0;background:transparent;color:#d9e5ef;text-align:left;padding:12px 13px;border-radius:8px;cursor:pointer;margin-bottom:3px;font-weight:600}aside button.active,aside button:hover{background:#2b4d6c;color:white}main{padding:25px;max-width:1450px;width:100%;margin:auto}h2{font-size:23px;margin:0 0 6px}h3{font-size:16px;margin:0 0 12px}p.note,.muted{color:var(--muted)}.note{margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:19px;margin-bottom:15px;box-shadow:0 2px 8px #1c395708}.metric{font-size:28px;font-weight:750}.small{font-size:12px}.label{font-weight:650;font-size:12px;color:#42566e;display:block;margin:0 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #c9d5e1;border-radius:7px;background:white;color:var(--ink);font:inherit}textarea{min-height:100px;resize:vertical}button.primary,button.secondary,button.danger{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:650;margin:3px 5px 3px 0}button.primary{background:var(--blue);color:white}button.secondary{background:#eaf0f7;color:#18324c}button.danger{background:#fce9ea;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.formrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 9px;vertical-align:top}th{background:#f2f6fa;color:#3b526b;white-space:nowrap}td{max-width:340px;overflow-wrap:anywhere}.tag{display:inline-block;background:#eaf1ff;color:#2051a0;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:650}.warn{background:#fff3df;color:#875200}.good{background:#e5f5ed;color:#116849}.bad{background:#fce8e8;color:#9c2735}.step{border-left:3px solid #a8bfd9;padding:7px 13px;margin:10px 0}.step strong{display:block}.status{background:#edf5fd;border:1px solid #c5dcf4;border-radius:8px;padding:11px;margin:12px 0;color:#1b4c77}.error{background:#fff0f0;color:#a52634;border-color:#f4c5c5}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.progress{height:9px;background:#e4eaf2;border-radius:8px;overflow:hidden}.progress>div{background:#17847e;height:100%}.detail{background:#f5f8fb;border:1px solid var(--line);padding:13px;border-radius:8px;white-space:pre-wrap;font:12px/1.6 ui-monospace,Consolas,monospace}.gate{border-left:4px solid var(--amber);padding:10px 14px;background:#fff9ed;margin-bottom:10px}.footer{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.formrow{grid-template-columns:1fr 1fr}}@media(max-width:700px){.shell{display:block}aside{display:flex;overflow:auto;gap:5px}aside button{white-space:nowrap;width:auto}.two,.grid,.formrow{grid-template-columns:1fr}main{padding:15px}header{padding:16px}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 14px}.tabs button{background:transparent;color:var(--muted);text-align:left;width:auto;margin:0 0 -2px;padding:10px 18px;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.loader{display:flex;align-items:center;gap:10px;padding:26px 4px;color:var(--muted)}.spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

</style></head><body><header><div><h1>Wellmatix / Food-to-Product Intelligence</h1><p>Peptide discovery → biological evidence → ingredient → tablet / drink feasibility</p></div><span class="pill" id="pill">PIPELINE API: checking...</span></header><div class="shell"><aside id="nav"></aside><main id="view"></main></div><script src="config.js"></script>
<script>
'use strict';const API_BASE=String((window.WMX_CONFIG||{}).apiBase||'').trim().replace(/\/+$/,'');const SEED=[{name:'Illustrative whey protein fragment',source:'Whey / β-lactoglobulin',sequence:'VAGTWYSLAMAASDISLLDAQSAPLR',origin:'DEMO_REFERENCE'},{name:'Illustrative casein fragment',source:'Milk / casein',sequence:'FFVAPFPEVFGK',origin:'DEMO_REFERENCE'},{name:'Illustrative soy fragment',source:'Soy protein',sequence:'LQSGDALRVPSGTTYY',origin:'DEMO_REFERENCE'}];const KEY='wmx-food-product-demo-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state)state={proteins:[],fragments:[],candidates:[],assays:[],logs:[],selected:null,config:{},review:{}};const pages=['Overview','Protein Library','Digestion Engine','Screening & Ranking','Biological Review','Assay Data','Ingredient Feasibility','Formulation Studio','Reports & Traceability'];let page='Overview';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const uid=(p)=>p+'-'+Math.random().toString(36).slice(2,9);function log(action){state.logs.unshift({at:new Date().toISOString(),action});state.logs=state.logs.slice(0,80);save()}function toast(msg,error=false){let e=$('notice');if(e){e.textContent=msg;e.className='status'+(error?' error':'')}}function nav(){ $('nav').innerHTML=pages.map((p,i)=>`<button class="${page===p?'active':''}" data-page="${esc(p)}">${String(i+1).padStart(2,'0')} &nbsp;${esc(p)}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}const frame=(title,sub,body)=>`<h2>${title}</h2><p class="note">${sub}</p><div id="notice" class="hidden"></div>${body}<p class="footer">Research-use prototype. Deterministic rules and illustrative heuristics are not validated predictions. No clinical efficacy, ingredient safety, regulatory approval or product stability is established.</p>`;const tab=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">No records yet.</td></tr>`}</tbody></table></div>`;const cell=x=>`<td>${esc(x)}</td>`;const options=(arr,selected)=>arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('');function proteinById(id){return state.proteins.find(x=>x.id===id)}function candidateById(id){return state.candidates.find(x=>x.id===id)}function assayFor(id){return state.assays.filter(a=>a.candidateId===id)}function grade(c){let a=assayFor(c.id);if(!a.length)return 'Not tested';let valid=a.filter(x=>x.isTest===false&&x.qc==='Pass'&&x.outcome==='Positive');return valid.length?'Observed positive (review required)':'Results recorded / not confirmed'}
function overview(){return frame('Discovery-to-product workspace','One auditable candidate journey, from food protein to research-stage product concept.',`<div class="grid"><div class="panel"><div class="muted small">Protein records</div><div class="metric">${state.proteins.length}</div></div><div class="panel"><div class="muted small">Theoretical fragments</div><div class="metric">${state.fragments.length}</div></div><div class="panel"><div class="muted small">Screened candidates</div><div class="metric">${state.candidates.length}</div></div><div class="panel"><div class="muted small">Assay records</div><div class="metric">${state.assays.length}</div></div></div><div class="two"><div class="panel"><h3>Workflow and decision gates</h3>${[['01','Protein and source registry','Provenance, allergen-source flags'],['02','Sequence-first digestion','Enzyme rules, positions, theoretical fragments'],['03','Evidence-aware candidate screening','Descriptive properties and limitations'],['04','Hazara biological review','Approved / hold / rejected for testing'],['05','Experimental GLP-1 validation','Real results distinct from test fixtures'],['06','Ingredient and formulation feasibility','Mass balance, dose, stability, taste, cost'],['07','Safety, manufacturing, regulatory','Required before consumer product']].map(x=>`<div class="step"><strong>${x[0]} · ${x[1]}</strong><span class="muted small">${x[2]}</span></div>`).join('')}</div><div class="panel"><h3>Getting started</h3><p>Use the bundled illustrative example to explore the entire workflow. It is <strong>not experimental evidence</strong>.</p><button class="primary" id="seed">Load clearly labeled demonstration proteins</button><button class="secondary" id="reset">Clear local demo data</button><div class="gate"><strong>Scientific boundary</strong><p>Primary research endpoint: endogenous GLP-1 secretion in a documented biological assay. This is not direct GLP-1 receptor agonism or evidence of weight loss.</p></div><p class="muted small">All work is local to this browser, except the Protein Library: it reads the food protein library from the API and submits runs to it (the address is in config.js).</p></div></div>`)}
let protTab='upload';
function uploadPanels(){return (`<div class="two"><div class="panel"><h3>Import protein</h3><div class="formrow"><div><label class="label">Food source</label><input id="food" value="Whey"></div><div><label class="label">Allergen-source alert</label><select id="allergen"><option>Review required</option><option>Known allergen source</option><option>Not established</option></select></div></div><label class="label">FASTA sequence (one or multiple entries)</label><textarea id="fasta" placeholder=">protein_1&#10;MKWVTFISLLFLFSSAYS..."></textarea><div class="actions"><input type="file" id="fastafile" accept=".fa,.fasta,.txt" style="max-width:240px"><button class="primary" id="import">Import & validate</button></div><div id="fastapreview" class="muted small">Paste or choose a FASTA file; every record needs a '>' header line.</div><p class="muted small">Accepted canonical amino acids: ACDEFGHIKLMNPQRSTVWY. A record with other characters, no identifier, no sequence or a repeated identifier is skipped and listed.</p></div><div class="panel"><h3>Source controls</h3><p>Each imported protein receives a stable local ID and records its sequence and source label. Production deployment should additionally capture accession version, lot, supplier, license, processing and checksum.</p><div class="gate">Food-source origin alone does not establish peptide safety or suitability for food use.</div></div></div><div class="panel"><h3>Run the food pipeline</h3><div class="formrow"><div><label class="label">Proteins to run (food source · allergen status)</label><select id="rungroup">${Object.entries(proteinGroups()).map(([k,v])=>`<option value="${esc(k)}">${esc(k.replace('||',' · '))} (${v.length})</option>`).join('')}</select></div></div><button class="primary" id="submitrun" ${state.proteins.length?'':'disabled'}>Submit run</button><div id="jobstatus" class="status hidden"></div><div id="jobresults"></div><p class="muted small">Sends the selected proteins as FASTA to POST /api/v1/jobs/food/create. "Known allergen source" is sent as true; "Review required" and "Not established" are sent as not established (null), never as false.</p></div><div class="panel"><h3>Protein registry</h3>${tab(['ID','Protein','Food source','Length','Allergen-source status'],state.proteins.map(p=>`<tr>${cell(p.id)}${cell(p.name)}${cell(p.source)}${cell(p.sequence.length)}${cell(p.allergen)}</tr>`))}</div>`)}
let setPillTimer=null;function setPill(ok,base){let el=$('pill');if(!el)return;el.textContent='PIPELINE API '+(ok?'CONNECTED':'NOT REACHABLE')+' · '+base;el.style.borderColor=ok?'#3fbf8f':'#e0707c';el.style.color=ok?'#bdf0dc':'#f6c3c8'}
async function checkApi(){let base=apiBase();if(!base)return setPill(false,'address not set (config.js)');try{let r=await fetch(base+'/healthz');setPill(r.ok,base)}catch(e){setPill(false,base)}}
const END_TEXT={SIGNAL_CLEAVED:'signal peptide cut off',PROPEP_CLEAVED:'propeptide cut off',TRANSIT_CLEAVED:'transit peptide cut off',INIT_MET_CLEAVED:'starting methionine cut off',CHAIN_JUNCTION:'meets another chain directly',SEQ_START:'first residue of the UniProt sequence (the real start may lie before it)',SEQ_END:'last residue of the UniProt sequence (the real end may lie beyond it)',UNANNOTATED:'no UniProt annotation for this end'};
const endText=c=>c?(END_TEXT[c]||c):'not recorded';
const fmtN=n=>n==null?'—':Number(n).toLocaleString();
const objText=o=>({digestion_plausibility:'digestion plausibility',coverage:'coverage (how fully the peptide is assessed)',developability_rule:'developability by the sequence rules',evidence:'evidence',model_allergenicity_score:'low predicted IgE binding',model_cytotoxicity_score:'low predicted cytotoxicity',model_aggregation_score:'low predicted aggregation',model_bitterness_score:'low predicted bitterness',model_solubility_score:'high predicted solubility',model_synthesis_feasibility_score:'high predicted synthesis feasibility'}[o]||o);
function summaryPanel(r){let s=r.ranking_summary;if(!s||!(s.stages||[]).length)return '';
let hr=s.hard_rules||{},g=s.evidence_gate||{},c=s.caps||{},pa=s.pareto||{},ob=s.objectives||{};
let rows=s.stages.map(x=>`<tr>${cell(x.label)}${cell(x.n_in?fmtN(x.n_in):'—')}${cell(fmtN(x.n_out))}${cell(Object.entries(x.removed||{}).map(([k,v])=>fmtN(v)+' '+k).join('; ')||'—')}</tr>`);
return `<details class="panel"><summary><b>How the list was made</b> (pool, hard rules, evidence gate, objectives, caps)</summary>${tab(['Step','In','Out','Removed, and why'],rows)}<p class="small"><b>Hard rules.</b> Before any model runs, a peptide is removed if it has a residue other than the 20 standard amino acids${hr.min_length?' or is shorter than '+hr.min_length+' or longer than '+hr.max_length+' amino acids':''}. Removed in this run: ${esc(Object.entries(hr.removed||{}).map(([k,v])=>fmtN(v)+' '+k).join('; ')||'none')}. The best ${fmtN(s.model_stage_pool_size||s.pool_sent_to_the_models)} of the pool on three cheap objectives then go to the models.</p><p class="small"><b>Evidence gate.</b> ${esc(g.rule||'')} In this run: ${fmtN(g.exact_evidence_requested)} asked for, ${fmtN(g.exact_evidence_in_final)} with an exact sequence match, shortfall ${fmtN(g.shortfall)}; ${(g.dropped_for_the_gate||[]).length} dropped and replaced to meet the gate.</p><p class="small"><b>Objectives</b> (0 to 1, higher is favourable; a model objective is the ranking value, not the model's own output): ${esc((ob.used||[]).map(objText).join('; ')||'not recorded for this run')}.${(ob.not_used_because_a_pooled_peptide_lacks_them||[]).length?' Not used because a pooled peptide lacks them: '+esc(ob.not_used_because_a_pooled_peptide_lacks_them.map(objText).join('; '))+'.':''}</p><p class="small"><b>How peptides are picked.</b> ${esc(pa.selection_rule||'')} Tie-break order (higher first), then sequence: ${esc((pa.tie_break||[]).map(objText).join(', ')||'not recorded for this run')}. ${esc(pa.weights||'')} Pareto fronts in the pool: ${fmtN(pa.n_fronts)}.</p><p class="small"><b>Caps.</b> At most ${c.max_per_sequence_cluster||'a set number of'} peptides from one sequence cluster and ${c.max_per_parent_family||'a set number of'} from one parent protein family. ${esc(c.rule||'')} Dropped for a cap in this run (${(c.dropped_for_the_caps||[]).length}): ${esc((c.dropped_for_the_caps||[]).join(', ')||'none')}.</p>${(r.digestion_warnings||[]).length?'<p class="small"><b>Digestion check warnings</b> (the digestion run again differs from a recorded origin): '+esc(r.digestion_warnings.map(w=>w.peptide_id+': '+w.detail).join(' | '))+'</p>':''}</details>`}
const RANK_NOTE=`<div class="gate"><b>Rank, shortlist position and the cut-off at 25.</b><ul><li><b>Rank</b> is the peptide's place among the 25 ranked peptides. The computed ranking sets it and review decisions never change it.</li><li><b>Shortlist</b> position is the place on the shortlist of at most 10, taken from the 25 in rank order, so shortlist 1 can be rank 4. A peptide is left off when its evidence is only a similarity or none, a model itself calls it cytotoxic, aggregation-prone, insoluble or hard to synthesise, a higher-ranked peptide of the same parent family is already on the list, or 4 designed peptides are already on it. Open a row to see its reason.</li><li><b>Why a peptide is among the 25:</b> the 400 best peptides of the pool go to the models. The 25 are picked front by front (a front is a group no other peptide beats on every score), at most 2 per sequence cluster and 3 per parent family, with 15 exact sequence matches asked for first; a shortfall is reported. A peptide outside the 25 is not listed and no reason is stored for it.</li></ul></div>`;
function parseFasta(text){const records=[],issues=[],seen=new Set(),blocks=[];const issue=(id,severity,message)=>issues.push({id,severity,message});for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(line.startsWith('>'))blocks.push({header:line.slice(1),parts:[]});else if(blocks.length)blocks[blocks.length-1].parts.push(line);else return {records,issues:[{id:'(file)',severity:'error',message:"Sequence data before the first '>' header: not a FASTA file."}]}}
if(!blocks.length)return {records,issues:[{id:'(file)',severity:'error',message:'No FASTA records found.'}]};
for(const b of blocks){const token=b.header.split(/\s+/)[0]||'',seq=b.parts.join('').toUpperCase().replace(/\*/g,'');if(!token){issue('(empty id)','error','Header has no identifier.');continue}
const m=token.match(/^([A-Za-z0-9_.|-]+?):(\d+)-(\d+)$/),sid=m?token:token+':1-'+seq.length;
if(seen.has(sid)){issue(sid,'error','Identifier appears more than once; rename one record.');continue}seen.add(sid);
if(!seq){issue(sid,'error','Record has no sequence.');continue}
const bad=[...new Set(seq)].filter(c=>!'ACDEFGHIKLMNPQRSTVWY'.includes(c)).sort();if(bad.length){issue(sid,'error','Non-standard residues '+bad.join(', ')+'; record skipped.');continue}
if(m&&(+m[3]-+m[2]+1)!==seq.length)issue(sid,'warning',`Header range ${m[2]}-${m[3]} implies ${+m[3]-+m[2]+1} residues but the sequence has ${seq.length}.`);
records.push({id:sid,header:b.header,name:b.header.slice(token.length).trim()||token,sequence:seq})}
return {records,issues}}
function issueList(issues){return issues.length?'<ul>'+issues.map(i=>`<li><span class="tag ${i.severity==='error'?'bad':'warn'}">${esc(i.severity)}</span> ${esc(i.id)}: ${esc(i.message)}</li>`).join('')+'</ul>':''}
function previewFasta(){let el=$('fastapreview');if(!el)return;let t=$('fasta').value.trim();if(!t){el.textContent="Paste or choose a FASTA file; every record needs a '>' header line.";return}let {records,issues}=parseFasta(t);el.innerHTML=`<strong>${records.length} usable record(s)</strong>, ${records.reduce((n,r)=>n+r.sequence.length,0)} residues${issueList(issues)}`}
function proteinGroups(){const m={};state.proteins.forEach(p=>{(m[p.source+'||'+p.allergen]=m[p.source+'||'+p.allergen]||[]).push(p)});return m}
let foodJob=null,foodTimer=null;const DONE=['succeeded','failed','cancelled','abandoned'];
function showJob(){let el=$('jobstatus');if(!el||!foodJob)return;let j=foodJob,live=!DONE.includes(j.run_state||'submitted');el.className='status'+(j.error||j.run_state==='failed'?' error':'');el.innerHTML=`<strong>Run ${esc(j.job_id)}</strong><br>${j.accepted} protein record(s) accepted${libraryLine(j)}<br>State: ${esc(j.run_state||'submitted')}${j.cancelRequested&&live?' (cancelling)':''}${j.stage&&j.stage!=='pending'?' · stage: '+esc(j.stage):''}${j.error?'<br>'+esc(j.error):''}<br><span class="small">Results folder: ${esc(j.result_path)}</span>${issueList(j.rejected||[])}${live?'<br><button class="danger" id="cancelrun">Cancel run</button>':''}`;if(live&&$('cancelrun'))$('cancelrun').onclick=cancelJob}
async function cancelJob(){if(!foodJob)return;try{let r=await fetch(foodJob.base+'/api/v1/jobs/food/'+foodJob.job_id+'/cancel',{method:'POST'}),d=await r.json();if(!r.ok)return toast('Could not cancel: '+(typeof d.detail==='string'?d.detail:r.status),true);foodJob.cancelRequested=true;log('Cancel requested for '+foodJob.job_id+': '+d.status);showJob();toast('Cancel: '+d.status+'.');clearTimeout(foodTimer);pollJob(foodJob.base)}catch(e){toast('Could not reach the API: '+e.message,true)}}
const num=x=>x==null?'—':Number(x).toFixed(2);

function formulationPage(){return frame('Tablet / capsule vs powder / drink','Compare development paths based on entered measurements or assumptions; no opaque suitability score.',`<div class="panel"><h3>Candidate formulation evidence</h3><div class="formrow"><div><label class="label">Ingredient</label><select id="formIngredient">${options(['Undetermined','Purified peptide','Standardized hydrolysate'],'Undetermined')}</select></div><div><label class="label">Intended ingredient amount per serving (mg)</label><input id="dosemg" type="number" min="0" placeholder="Not established"></div><div><label class="label">Water solubility</label><select id="solubility">${options(['Not measured','Measured adequate','Measured limited'],'Not measured')}</select></div><div><label class="label">Taste / bitterness</label><select id="bitterness">${options(['Not measured','Acceptable in sensory test','High bitterness observed'],'Not measured')}</select></div><div><label class="label">Processing stability</label><select id="processing">${options(['Not measured','Measured stable under intended process','Instability observed'],'Not measured')}</select></div><div><label class="label">Biological validation</label><select id="validated">${options(['Not established','Reproducible in-vitro activity reviewed','No reproducible activity'],'Not established')}</select></div></div><button class="primary" id="compare">Compare development requirements</button><div id="compareResult" class="status">Select evidence and run the comparison.</div></div><div class="two"><div class="panel"><h3>Tablet / capsule studies</h3><p>Loading, compressibility, dissolution, excipient compatibility, moisture and temperature stability, shelf-life and dose uniformity.</p></div><div class="panel"><h3>Powder / drink studies</h3><p>Reconstitution, solubility, pH, taste, haze, processing stability, microbial controls, packaging and shelf-life.</p></div></div>`)}

function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function download(name,data,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCandidates(){download('wellmatix_candidates.csv',csv([['id','sequence','source','origin','length','hydrophobic_fraction','glp1_evidence','review_status'],...state.candidates.map(c=>[c.id,c.sequence,c.source,c.origin,c.length,c.hyd,'Not validated',state.review[c.id]?.status||'Pending'])]),'text/csv')}function exportAssays(){download('wellmatix_assays.csv',csv([['candidate_id','material','endpoint','concentration','unit','cell_model','replicates','outcome','qc','is_test_data'],...state.assays.map(a=>[a.candidateId,a.material,a.endpoint,a.concentration,a.unit,a.cellModel,a.replicates,a.outcome,a.qc,a.isTest])]),'text/csv')}
function bind(){let b=id=>$(id);document.querySelectorAll('[data-prottab]').forEach(t=>t.onclick=()=>{protTab=t.dataset.prottab;render()});if(b('libgo')){if(!lib.loaded){lib.loaded=true;libLoad()}else libBody();b('libgo').onclick=()=>{lib.filters.q=b('libq').value.trim();lib.filters.food_source=b('libsource').value;lib.filters.family=b('libfamily').value;libLoad()};b('libsource').onchange=()=>{lib.filters.food_source=b('libsource').value;lib.filters.family='';lib.filters.q=b('libq').value.trim();libLoad()};b('libfamily').onchange=()=>{lib.filters.family=b('libfamily').value;lib.filters.q=b('libq').value.trim();libLoad()};b('libq').onkeydown=e=>{if(e.key==='Enter')b('libgo').onclick()};b('libselmode').onchange=()=>{let v=b('libselmode').value;if(v==='all')lib.rows.forEach(p=>lib.sel.add(p.substrate_id));libBody()};b('libclear').onclick=()=>{lib.sel.clear();libBody()};b('librun').onclick=libRun;showJob();showResults()}if(b('seed'))b('seed').onclick=()=>{if(!confirm('Add illustrative demo proteins?'))return;SEED.forEach(x=>state.proteins.push({id:uid('P'),name:x.name,source:x.source,sequence:x.sequence,allergen:'Review required',demo:true}));log('Loaded illustrative protein examples');render()};if(b('reset'))b('reset').onclick=()=>{if(!confirm('Delete all locally saved demo records?'))return;state={proteins:[],fragments:[],candidates:[],assays:[],logs:[],selected:null,config:{},review:{}};save();render()};if(b('fasta'))b('fasta').oninput=previewFasta;if(b('fastafile'))b('fastafile').onchange=async e=>{let f=e.target.files[0];if(f){b('fasta').value=await f.text();previewFasta()}};if(b('import'))b('import').onclick=()=>{let source=b('food').value.trim();if(!source)return toast('Provide a food source.',true);let {records,issues}=parseFasta(b('fasta').value);if(!records.length)return toast('No usable FASTA record. '+issues.map(i=>i.id+': '+i.message).join(' | '),true);for(let r of records)state.proteins.push({id:uid('P'),name:r.name,fastaId:r.id,header:r.header,source,sequence:r.sequence,allergen:b('allergen').value,demo:false});log('Imported '+records.length+' protein(s)'+(issues.length?', '+issues.length+' FASTA issue(s)':''));render();toast('Imported '+records.length+' protein(s)'+(issues.length?'; '+issues.length+' issue(s): '+issues.map(i=>i.id+': '+i.message).join(' | '):'')+'.',issues.some(i=>i.severity==='error'))};if(b('submitrun')){showJob();showResults();b('submitrun').onclick=async()=>{let key=b('rungroup').value,group=proteinGroups()[key];if(!group)return;let [source,allergen]=key.split('||'),base=apiBase();save();clearTimeout(foodTimer);let body={request_id:uid('food'),fasta:group.map(p=>'>'+(p.header||p.id+' '+p.name)+'\n'+p.sequence).join('\n'),food_source:source,allergen_source:allergen==='Known allergen source'?true:null};try{let r=await fetch(base+'/api/v1/jobs/food/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok){let d=data.detail;return toast('Run not started: '+(typeof d==='string'?d:d&&d.message?d.message+' '+(d.rejected||[]).map(i=>i.id+': '+i.message).join(' | '):JSON.stringify(d)),true)}foodJob=data;foodJob.base=base;log('Submitted food run '+data.job_id+' with '+data.accepted+' protein(s)');showJob();pollJob(base)}catch(e){toast('Could not reach the API at '+base+': '+e.message,true)}}};if(b('digest'))b('digest').onclick=()=>{let p=proteinById(b('proteinselect').value),enzyme=b('enzyme').value,missed=+b('missed').value;if(!p)return;let out=digest(p.sequence,enzyme,missed);for(let x of out)state.fragments.push({...x,id:uid('F'),proteinId:p.id,enzyme,method:'Simplified sequence rule',observed:false});log(`Digestion: ${p.name}, ${enzyme}, ${out.length} theoretical fragments`);render();toast('Generated '+out.length+' theoretical fragments. No experimental survival claim.')};if(b('screen'))b('screen').onclick=()=>{let existing=new Set(state.candidates.map(c=>c.fragmentId));let count=0;for(let f of state.fragments){if(existing.has(f.id))continue;let d=descriptor(f.sequence),p=proteinById(f.proteinId);state.candidates.push({id:uid('C'),fragmentId:f.id,sequence:f.sequence,source:p?.source||'Unknown',proteinId:f.proteinId,origin:'THEORETICAL_DIGEST',length:d.len,hyd:d.hyd,charged:d.charged,arom:d.arom,rankHint:(d.len>=6&&d.len<=20?2:0)+(1-d.hyd)+d.charged});count++}state.candidates.sort((a,b)=>b.rankHint-a.rankHint||a.sequence.localeCompare(b.sequence));log('Registered '+count+' theoretical peptide candidates; heuristic order only');render();toast('Registered '+count+' candidates. No validated GLP-1 predictions were generated.')};if(b('exportc'))b('exportc').onclick=exportCandidates;if(b('saveReview'))b('saveReview').onclick=async()=>{let id=b('reviewcand').value,who=b('reviewer').value.trim();if(!id)return;if(!who)return toast('Enter the reviewer name.',true);try{let x=await fetch(foodJob.base+'/api/v1/jobs/food/'+foodJob.job_id+'/review/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:b('decision').value,reason:b('rationale').value,reviewer:who})}),d=await x.json();if(!x.ok)return toast('Review not saved: '+apiError(d.detail),true);foodJob.reviewer=who;log('Biological review saved for '+id+': '+d.record.decision);await loadResults(foodJob.base);render();toast('Review saved on the server.')}catch(e){toast('Could not reach the API: '+e.message,true)}};if(b('shortlist'))b('shortlist').onclick=async()=>{try{let x=await fetch(foodJob.base+'/api/v1/jobs/food/'+foodJob.job_id+'/experiment-sheet');if(x.ok)download('experiment_sheet.csv',await x.text(),'text/csv');else toast('Experiment sheet not available ('+x.status+').',true)}catch(e){toast('Could not read the experiment sheet: '+e.message,true)}};if(b('saveAssay'))b('saveAssay').onclick=()=>{let id=b('assaycand').value,n=Number(b('concentration').value),reps=Number(b('replicates').value);if(!id||!b('concentration').value||!Number.isFinite(n)||n<0||!Number.isInteger(reps)||reps<1||!b('cellmodel').value.trim())return toast('Provide a candidate, valid concentration, cell model and replicate count.',true);state.assays.push({id:uid('A'),candidateId:id,material:b('material').value,outcome:b('assaystatus').value,endpoint:b('endpoint').value,concentration:n,unit:b('concunit').value,cellModel:b('cellmodel').value,replicates:reps,qc:b('qc').value,isTest:b('testdata').checked,at:new Date().toISOString()});log('Assay observation recorded; test flag '+b('testdata').checked);render();toast('Observation saved. Requires independent biological QC and review.')};if(b('exporta'))b('exporta').onclick=exportAssays;if(b('calcIngredient'))b('calcIngredient').onclick=()=>{let raw=+b('rawkg').value,r=+b('recovery').value,y=+b('yield').value,c=+b('rawcost').value,p=+b('processcost').value;if(![raw,r,y,c,p].every(Number.isFinite)||raw<=0||r<0||r>100||y<0||y>100||c<0||p<0)return toast('Enter valid nonnegative assumptions; percentages must be 0–100.',true);let output=raw*r/100*y/100,unit=output?(raw*c+p)/output:NaN;b('ingredientResult').innerHTML=`<strong>Assumption-only scenario · ${esc(b('route').value)}</strong><p>Estimated output: <strong>${output.toFixed(2)} kg</strong> from ${raw.toFixed(2)} kg input.</p><p>Indicative cost: <strong>${Number.isFinite(unit)?unit.toFixed(2):'Undefined'} currency units/kg</strong>, excluding many real manufacturing costs.</p><p class="small">Not an experimentally measured yield, purity, food-grade process or price quote.</p>`};if(b('compare'))b('compare').onclick=()=>{let dose=b('dosemg').value?+b('dosemg').value:null,sol=b('solubility').value,taste=b('bitterness').value,st=b('processing').value,bio=b('validated').value,ing=b('formIngredient').value;let needs=[];if(bio!=='Reproducible in-vitro activity reviewed')needs.push('Biological efficacy evidence is not sufficient to advance a lead.');if(sol==='Not measured')needs.push('Measure water solubility across relevant pH.');if(taste==='Not measured')needs.push('Perform sensory/bitterness evaluation.');if(st==='Not measured')needs.push('Measure thermal, pH and storage stability.');if(ing==='Undetermined')needs.push('Choose and characterize purified peptide versus standardized hydrolysate.');if(dose===null)needs.push('Determine experimental dose and ingredient loading.');let tablet=dose!==null&&dose>1000?'High ingredient loading may constrain solid dosage form.':'Assess compressibility, excipient compatibility and dissolution.';let drink=sol==='Measured limited'?'Solubility is a significant beverage formulation issue.':'Assess reconstitution, pH stability and sensory acceptance.';if(taste==='High bitterness observed')drink+=' Bitterness mitigation required.';if(st==='Instability observed')drink+=' Process conditions may require redesign.';b('compareResult').innerHTML=`<strong>Product development assessment (not approval)</strong><p><strong>Tablet/capsule:</strong> ${esc(tablet)}</p><p><strong>Powder/drink:</strong> ${esc(drink)}</p><p><strong>Unresolved evidence:</strong></p><ul>${(needs.length?needs:['Review safety, manufacturing, regulatory and stability evidence before any product decision.']).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`};if(b('jsonExport'))b('jsonExport').onclick=()=>download('wellmatix_food_to_product_snapshot.json',JSON.stringify({schema:'wmx-food-product-demo-v2',exportedAt:new Date().toISOString(),data:state},null,2),'application/json');if(b('csvExport'))b('csvExport').onclick=exportCandidates;if(b('assayExport'))b('assayExport').onclick=exportAssays}
function render(){nav();$('view').innerHTML=({'Overview':overview,'Protein Library':proteinPage,'Digestion Engine':digestionPage,'Screening & Ranking':screenPage,'Biological Review':reviewPage,'Assay Data':assaysPage,'Ingredient Feasibility':ingredientPage,'Formulation Studio':formulationPage,'Reports & Traceability':reportsPage}[page])();bind()}render();checkApi();
</script></body></html>
