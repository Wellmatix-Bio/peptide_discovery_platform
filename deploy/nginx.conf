# One origin for the app and its API, so no CORS policy exists or is needed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A brief is small, but the "Advanced: JSON" tab lets a caller paste a whole request.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # data: images are the captcha, rendered as an <img> so its SVG cannot run anything.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(auth|api)/ {
        proxy_pass http://accounts:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITTEN, not appended to ($proxy_add_x_forwarded_for would keep whatever the client
        # sent). The accounts service rate-limits per address from this header and trusts it only
        # because nginx is the one route in. If a TLS proxy or load balancer is put in front of
        # nginx, $remote_addr becomes that proxy and every user shares one allowance: configure
        # nginx's real_ip module for that proxy first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NOT the pipeline's runtime. A run takes minutes to hours and the client polls for it;
        # this covers the API's own slowest call -- a create, which writes to Cloud Storage and
        # submits to Vertex, or a results read, which pulls a run's shortlist back out.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /healthz {
        proxy_pass http://accounts:8080/healthz;
    }

    # `expires`, not add_header: an add_header inside a location silently drops every add_header
    # above, security headers included.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app; the app decides what a signed-out user may see,
    # and the proxy decides what anyone may call.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
