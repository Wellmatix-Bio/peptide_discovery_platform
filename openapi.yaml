      title: CosmeticJobResultsResponse
      description: Results of a cosmetic job. `ranked_candidates` counts candidates with a `final_score`. `insufficient_evidence_candidates` counts candidates with at least one component not screened. Component statistics average each ranking component's score over the candidates that screened it.
