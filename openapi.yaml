openapi: 3.1.0
info:
  title: End-to-end Pipeline Jobs API
  version: 1.0.0
  description: Job creation and status checks only. Stage parameters are validated
    by stage name. No application-level authentication is defined.
paths:
  /api/v1/jobs/create:
    post:
      summary: Submit a full pipeline job
      operationId: createJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            example:
              request_id: request-001
              stages:
                s01_therapeutic_product_brief:
                  brief:
                    wound_context:
                    - chronic
                    - infected
                    - high_glucose
                    - ischemic
                    desired_functions:
                    - antimicrobial
                    - keratinocyte_migration
                    - angiogenesis
                    - anti_inflammatory
                    pathogens:
                    - Staphylococcus_aureus
                    - Pseudomonas_aeruginosa
                    min_length: 6
                    max_length: 30
                    dosing_interval_hours: 48
                  seed: 42
                s04_candidate_generation:
                  tags:
                  - <AMP>
                  n_peptides: 100
                  max_new_tokens: 120
                  batch_size: 16
                  max_attempts: 20
                  generator: null
                  route_a_ga_params:
                    pop_size: 3
                    n_generations: 5
                    mutation_rate: 0.1
                  route_a_constraint_config:
                    charge_min: -3
                    charge_max: 8
                    hydro_min: -1
                    hydro_max: 1
                    aggregation_threshold: 3
                    ph: 7.4
                s05_physchem_screening:
                  ph: 7.4
                  solubility_solvent: Ultrapure water
                  aggregation_tendency_flag_max: 0.75
                  solubility_flag_min: 0.3
                  amphipathicity_flag_max: 0.8
                  isoelectric_point_flag_ph_window: 0.5
                  ss_confidence_unstable_max: 0.5
                  ss_confidence_ambiguous_max: 0.7
                  risk_category_low_max: 0
                  risk_category_medium_max: 2
                s06_functional_models:
                  stage6_thresholds:
                    min_amp_probability: 0.7
                    min_proliferation_migration: 0.5
                    min_angiogenic_activity: 0.1
                    min_anti_inflammatory_probability: 0.5
                    max_mic:
                      Escherichia_coli: 32.0
                      Staphylococcus_aureus: 32.0
                      Pseudomonas_aeruginosa: 32.0
                    max_mbic:
                      Pseudomonas_aeruginosa: 32.0
                      Staphylococcus_aureus: 32.0
                      Candida_albicans: 32.0
                s07_structure_mechanism:
                  plddt_low_confidence_max: 0.5
                  pathway_engagement_min_probability: 0.5
                  helix_phi_min: -100
                  helix_phi_max: -30
                  helix_psi_min: -77
                  helix_psi_max: -5
                  sheet_phi_min: -180
                  sheet_phi_max: -45
                  sheet_psi_min: 90
                  sheet_psi_max: 180
                s08_safety_developability:
                  hemolysis_phc50_reject_max: 4
                  solubility_solvent: Ultrapure water
                  cytotoxicity_cell_type: DRAMP_aggregate
                  cytotoxicity_reject_max: 0.5
                  aggregation_reject_max: 0.7
                  solubility_flag_min: 0.3
                  cleavage_stability_reject_min: 0.3
                  cleavage_decay_rate: 0.5
                s09_synthesis_cmc:
                  rejected_difficulty_classes:
                  - high
        required: true
      responses:
        '202':
          description: Job submitted and configuration published; pipeline execution
            is not yet complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
              example:
                request_id: request-001
                job_id: projects/123/locations/us-central1/customJobs/456
                result_path: gs://bucket/artifacts/runs/456
        '422':
          description: Malformed request body (schema-level validation, caught before
            create_job runs) or a semantically invalid job config (e.g. min_length
            > max_length, caught inside create_job). The former returns HTTPValidationError,
            the latter ErrorResponse.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Google API or config publication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Missing server configuration or credentials, or invalid storage
            settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Returns after job submission and publication of config.json. The
        numeric Vertex job ID becomes the internal run ID. Request IDs are not deduplicated;
        use a unique request ID per submission to avoid sharing the request-path config.
  /api/v1/jobs/{job_id}/status:
    get:
      summary: Read the current Vertex job state
      operationId: getJobStatus
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
          pattern: ^projects/[^/]+/locations/[^/]+/customJobs/[0-9]+$
          examples:
          - projects/123/locations/us-central1/customJobs/456
        description: Full resource name, e.g. projects/123/locations/us-central1/customJobs/456.
          Contains slash-separated path segments.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
              example:
                job_id: projects/123/locations/us-central1/customJobs/456
                status: running
                stage: s06_functional_models
                vertex_state: JOB_STATE_RUNNING
                error: null
        '422':
          description: Malformed job resource name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Google API call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Missing server configuration or credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: job_id is the complete Vertex resource name containing slashes.
        The server uses a catch-all path parameter; clients must preserve the resource
        path. `stage` is the stage recorded in this run's results.json
        (`"pending"` if the run hasn't written one yet) -- a worker-progress signal
        independent of `status`, which reflects the Vertex job's own lifecycle
        state only.
  /api/v1/jobs/{job_id}/results:
    get:
      summary: Read a finished job's ranked candidates and score statistics
      operationId: getJobResults
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
          pattern: ^projects/[^/]+/locations/[^/]+/customJobs/[0-9]+$
          examples:
          - projects/123/locations/us-central1/customJobs/456
        description: Full resource name, e.g. projects/123/locations/us-central1/customJobs/456.
          Contains slash-separated path segments.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JobResultsResponse'
                - $ref: '#/components/schemas/MetabolicJobResultsResponse'
                - $ref: '#/components/schemas/CosmeticJobResultsResponse'
                discriminator:
                  propertyName: pipeline
                  mapping:
                    wound_healing: '#/components/schemas/JobResultsResponse'
                    metabolic: '#/components/schemas/MetabolicJobResultsResponse'
                    cosmetic: '#/components/schemas/CosmeticJobResultsResponse'
              example:
                job_id: projects/123/locations/us-central1/customJobs/456
                run_id: '456'
                status: success
                n_final: 12
                ranked_candidates: 10
                insufficient_evidence_candidates: 2
                component_stats:
                  wound_closure:
                    count: 10
                    mean: 0.62
                    median: 0.60
                    min: 0.31
                    max: 0.94
                candidates:
                - id: cand-001
                  sequence: EFELDRICGYGTARCRKKCRSQEYRIGRCPNTYACCLRKWDESLLNRTKP
                  final_score_rank: 1
                  pareto_rank: 1
                  final_score: 0.71
                  evidence_coverage: 0.9
                  missing_modules:
                  - collagen_ecm
                  amp_probability: 0.91
                  hemolytic_activity_phc50: 5.2
                  molecular_weight: 2140.6
                  net_charge: 4.0
                  instability_index: 28.4
                  deamidation_risk: low
                  oxidation_risk: medium
                  solubility: 0.72
                  aggregation_tendency: 0.21
                  anti_inflammatory_probability: 0.64
                  angiogenic_activity: 0.33
                  proliferation_probability: 0.58
                  migration_probability: 0.61
                  cytotoxicity_probability: 0.12
                  cleavage_stability: 0.77
                  log_mic_um:
                    Escherichia coli: 0.9
                    Staphylococcus aureus: 1.1
                  pmbic:
                    Staphylococcus aureus: 4.3
                  activated_pathways:
                  - PI3K_AKT_MTOR
                  inhibited_pathways:
                  - NF_KB
        '404':
          description: Job results not found, or the job succeeded but candidates_final.json
            is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed job resource name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Missing server configuration or credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Reads run_dir/results.json for job status; if the job succeeded,
        also reads candidates_final.json and computes per-component mean/median/min/max
        over each ranking module's post-deduction `score` (predictions.ranking.modules)
        of candidates with ranking status "ranked". Jobs
        that are still running or failed return status only, with an empty candidates
        list. Worker output files, not the live Vertex job state, are the source
        of truth here.
  /api/v1/jobs/{job_id}/cancel:
    post:
      summary: Request cancellation of a running Vertex job
      operationId: cancelJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
          pattern: ^projects/[^/]+/locations/[^/]+/customJobs/[0-9]+$
          examples:
          - projects/123/locations/us-central1/customJobs/456
        description: Full resource name, e.g. projects/123/locations/us-central1/customJobs/456.
          Contains slash-separated path segments.
      responses:
        '200':
          description: Cancellation requested (`cancelling`; the job may still take
            time to actually stop), or nothing to do because the job was already
            cancelling/cancelled (`cancelled`) or had already failed/expired (`failed`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - cancelling
                    - cancelled
                    - failed
                example:
                  job_id: projects/123/locations/us-central1/customJobs/456
                  status: cancelling
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed job resource name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Google API call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Missing server configuration or credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Does not wait for the job to actually stop; poll status
        separately to confirm.
components:
  schemas:
    CreateJobRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
        pipeline:
          type: string
          enum:
          - wound_healing
          - metabolic
          - cosmetic
          default: wound_healing
          title: Pipeline
          description: Which pipeline runs, and which worker image executes it. Must match
            the shape of `stages`; a mismatch is rejected with 422.
        stages:
          oneOf:
          - $ref: '#/components/schemas/E2ERequest'
          - $ref: '#/components/schemas/MetabolicE2ERequest'
          - $ref: '#/components/schemas/CosmeticE2ERequest'
          title: Stages
          description: The wound-healing stages for `pipeline` wound_healing, the metabolic
            stages (keyed by `s01_metabolic_therapeutic_product_brief`) for `metabolic`, and
            the cosmetic stages (keyed by `s01_cosmetic_therapeutic_product_brief`) for `cosmetic`.
      additionalProperties: false
      type: object
      required:
      - request_id
      - stages
      title: CreateJobRequest
    CreateJobResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        job_id:
          type: string
          title: Job Id
        result_path:
          type: string
          title: Result Path
      type: object
      required:
      - request_id
      - job_id
      - result_path
      title: CreateJobResponse
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
          enum:
          - pending
          - running
          - success
          - fail
          - stopped
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
          default: pending
          description: Stage the worker was on at its last progress write in
            results.json, or "pending" if none has been written yet. The
            handler substitutes "pending" for a missing value, so clients
            should not normally see null.
        vertex_state:
          type: string
          title: Vertex State
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      - vertex_state
      title: JobStatusResponse
    ComponentStats:
      properties:
        count:
          type: integer
          title: Count
        mean:
          type: number
          title: Mean
        median:
          type: number
          title: Median
        min:
          type: number
          title: Min
        max:
          type: number
          title: Max
      type: object
      required:
      - count
      - mean
      - median
      - min
      - max
      title: ComponentStats
    JobResultsResponse:
      properties:
        pipeline:
          type: string
          const: wound_healing
          default: wound_healing
          title: Pipeline
        job_id:
          type: string
          title: Job Id
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          title: Status
        n_final:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Final
        ranked_candidates:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ranked Candidates
        insufficient_evidence_candidates:
          anyOf:
          - type: integer
          - type: 'null'
          title: Insufficient Evidence Candidates
        component_stats:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStats'
          title: Component Stats
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateResponse'
          default: []
          title: Candidates
      type: object
      required:
      - job_id
      - run_id
      - status
      title: JobResultsResponse
    CandidateResponse:
      description: Flattened per-candidate summary projected from the candidate's
        predictions in candidates_final.json. Scalar fields are null when the
        producing stage did not run or abstained; log_mic_um and pmbic are empty
        objects in that case. Unlisted predictions are not returned.
      properties:
        id:
          type: string
          title: Id
          default: '?'
          description: Candidate id; "?" if the record has none
        sequence:
          anyOf:
          - type: string
          - type: 'null'
          title: Sequence
          description: Peptide sequence (top-level candidate field, not under
            predictions)
        final_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Final Score
          description: predictions.ranking.final_score, in [0, 1]. Null for
            insufficient_evidence candidates.
        evidence_coverage:
          anyOf:
          - type: number
          - type: 'null'
          title: Evidence Coverage
          description: predictions.ranking.evidence_coverage, the fraction of
            activated ranking modules that have a score
        missing_modules:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Missing Modules
          description: predictions.ranking.missing_modules, activated ranking
            modules with no score
        final_score_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Final Score Rank
          description: predictions.ranking.final_score_rank, the 1-based position
            by weighted final_score. Null for candidates that were not ranked
            (insufficient evidence).
        pareto_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pareto Rank
          description: predictions.ranking.pareto_rank, the Pareto front over the
            ranking modules' scores. 1 is non-dominated; candidates on the same
            front share a rank, so it is not a position. Independent of
            final_score_rank. Null for candidates that were not ranked.
        amp_probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Amp Probability
          description: predictions.amp_probability
        hemolytic_activity_phc50:
          anyOf:
          - type: number
          - type: 'null'
          title: Hemolytic Activity Phc50
          description: predictions.hemolysis.phc50
        molecular_weight:
          anyOf:
          - type: number
          - type: 'null'
          title: Molecular Weight
          description: predictions.molecular_weight, in Daltons
        net_charge:
          anyOf:
          - type: number
          - type: 'null'
          title: Net Charge
          description: predictions.net_charge
        instability_index:
          anyOf:
          - type: number
          - type: 'null'
          title: Instability Index
          description: predictions.instability_index
        deamidation_risk:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
          - type: 'null'
          title: Deamidation Risk
          description: predictions.deamidation_risk.risk_category
        oxidation_risk:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
          - type: 'null'
          title: Oxidation Risk
          description: predictions.oxidation_risk.risk_category
        solubility:
          anyOf:
          - type: number
          - type: 'null'
          title: Solubility
          description: predictions.solubility.score
        aggregation_tendency:
          anyOf:
          - type: number
          - type: 'null'
          title: Aggregation Tendency
          description: predictions.aggregation_tendency.score
        anti_inflammatory_probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Anti Inflammatory Probability
          description: predictions.anti_inflammatory_probability
        angiogenic_activity:
          anyOf:
          - type: number
          - type: 'null'
          title: Angiogenic Activity
          description: predictions.angiogenic_activity.angiogenic
        proliferation_probability:
          anyOf:
          - type: number
          - type: 'null'
          default: 0
          title: Proliferation Probability
          description: predictions.proliferation_migration.proliferation. Note the
            default is 0, not null, when absent.
        migration_probability:
          anyOf:
          - type: number
          - type: 'null'
          default: 0
          title: Migration Probability
          description: predictions.proliferation_migration.migration. Note the
            default is 0, not null, when absent.
        cytotoxicity_probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Cytotoxicity Probability
          description: predictions.cytotoxicity.score
        cleavage_stability:
          anyOf:
          - type: number
          - type: 'null'
          title: Cleavage Stability
          description: predictions.cleavage_stability.score
        log_mic_um:
          type: object
          propertyNames:
            enum:
            - Escherichia coli
            - Staphylococcus aureus
            - Pseudomonas aeruginosa
          additionalProperties:
            type: number
          title: Log Mic Um
          description: predictions.mic.log_mic_um, keyed by pathogen name with a
            space (not an underscore)
        pmbic:
          type: object
          propertyNames:
            enum:
            - Acinetobacter baumannii
            - Candida albicans
            - Candida tropicalis
            - Cutibacterium acnes
            - Enterococcus faecium
            - Escherichia coli
            - Klebsiella pneumoniae
            - Pseudomonas aeruginosa
            - Salmonella enterica
            - Staphylococcus aureus
            - Staphylococcus epidermidis
            - Streptococcus mutans
            - Streptococcus sanguinis
          additionalProperties:
            type: number
          title: Pmbic
          description: predictions.mbic.pmbic, keyed by pathogen name with a space
        activated_pathways:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Activated Pathways
          description: predictions.mechanism.activated_pathways (pathway_mapping_predictor_v2
            P(activator) >= pathway_engagement_min_probability)
        inhibited_pathways:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Inhibited Pathways
          description: predictions.mechanism.inhibited_pathways (P(activator) <= 1
            - pathway_engagement_min_probability)
      type: object
      required:
      - log_mic_um
      - pmbic
      title: CandidateResponse
    MetabolicCandidateResponse:
      description: 'A metabolic candidate: the ranks and shared physicochemical and safety values, plus the receptor
        predictions.'
      properties:
        activated_pathways:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Activated Pathways
        aggregation_tendency:
          anyOf:
          - type: number
          - type: 'null'
          title: Aggregation Tendency
        agonism_probability:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          propertyNames:
            enum:
            - GLP1R
            - GIPR
            - GCGR
          title: Agonism Probability
          type: object
        anti_inflammatory_probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Anti Inflammatory Probability
        binding_pkd:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          propertyNames:
            enum:
            - GLP1R
            - GIPR
            - GCGR
          title: Binding Pkd
          type: object
        cleavage_stability:
          anyOf:
          - type: number
          - type: 'null'
          title: Cleavage Stability
        cytotoxicity_probability:
          anyOf:
          - type: number
          - type: 'null'
          title: Cytotoxicity Probability
        deamidation_risk:
          anyOf:
          - enum:
            - low
            - medium
            - high
            type: string
          - type: 'null'
          title: Deamidation Risk
        ec50_nm:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          propertyNames:
            enum:
            - GLP1R
            - GIPR
            - GCGR
          title: Ec50 Nm
          type: object
        evidence_coverage:
          anyOf:
          - type: number
          - type: 'null'
          title: Evidence Coverage
        final_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Final Score
        final_score_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Final Score Rank
        half_life_minutes:
          anyOf:
          - type: number
          - type: 'null'
          title: Half Life Minutes
        hemolytic_activity_phc50:
          anyOf:
          - type: number
          - type: 'null'
          title: Hemolytic Activity Phc50
        id:
          default: '?'
          title: Id
          type: string
        inhibited_pathways:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Inhibited Pathways
        instability_index:
          anyOf:
          - type: number
          - type: 'null'
          title: Instability Index
        metabolic_activity_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Metabolic Activity Score
        missing_modules:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Missing Modules
        molecular_weight:
          anyOf:
          - type: number
          - type: 'null'
          title: Molecular Weight
        net_charge:
          anyOf:
          - type: number
          - type: 'null'
          title: Net Charge
        oxidation_risk:
          anyOf:
          - enum:
            - low
            - medium
            - high
            type: string
          - type: 'null'
          title: Oxidation Risk
        p_hemolytic:
          anyOf:
          - type: number
          - type: 'null'
          title: P Hemolytic
        pareto_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pareto Rank
        pec50:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          propertyNames:
            enum:
