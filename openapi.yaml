      title: CosmeticE2ERequest
      description: 'The public cosmetic job request shape (`pipeline: "cosmetic"`). Only the brief is required; every other stage defaults.


        Stage 7 is the shared structure stage and stays on. The cosmetic stages replace their wound-healing peers,
        so the wound-healing stage names are not accepted here.'
