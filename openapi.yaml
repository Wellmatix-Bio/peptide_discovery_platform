          $ref: '#/components/schemas/Stage9CosmeticRequest'
        s11_cosmetic_ranking:
          $ref: '#/components/schemas/Stage11CosmeticRequest'

    CosmeticComponentScore:
      type: object
      additionalProperties: false
      title: CosmeticComponentScore
      required:
      - score
      - screened
      properties:
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: The component's 0-1 score. A component that was not screened is neutral (0.5 by default).
        screened:
          type: boolean
          description: False when the check did not run for this candidate.

    CosmeticCandidateResponse:
      type: object
      additionalProperties: false
      title: CosmeticCandidateResponse
      description: Flat per-candidate summary projected from the cosmetic candidate record. The full prediction tree is in candidates_final.json. A field is null when the producing stage did not run or abstained.
      required:
      - id
      properties:
        id:
          type: string
        sequence:
          anyOf:
          - type: string
          - type: 'null'
        final_score:
          anyOf:
          - type: number
          - type: 'null'
          description: 0-100 weighted score (`predictions.ranking.final_score`).
        final_score_rank:
          anyOf:
          - type: integer
          - type: 'null'
          description: 1-based position by final_score.
        pareto_rank:
          anyOf:
          - type: integer
          - type: 'null'
          description: Pareto front over the weighted components. Candidates on one front share a rank; it is not a position.
        evidence_coverage:
          anyOf:
          - type: number
          - type: 'null'
          description: Share of the total component weight that was actually screened (`predictions.ranking.coverage`).
        not_screened:
          type: array
          items:
            type: string
          description: Names of the ranking components that were not screened.
        component_scores:
          type: object
          additionalProperties: false
          description: One entry per ranking component.
          properties:
            primary_function:
              $ref: '#/components/schemas/CosmeticComponentScore'
            secondary_functions:
              $ref: '#/components/schemas/CosmeticComponentScore'
            safety:
              $ref: '#/components/schemas/CosmeticComponentScore'
            delivery_fit:
              $ref: '#/components/schemas/CosmeticComponentScore'
            stability:
              $ref: '#/components/schemas/CosmeticComponentScore'
            developability:
              $ref: '#/components/schemas/CosmeticComponentScore'
        primary_function:
          anyOf:
          - type: string
            enum:
            - collagen_ecm
            - antioxidant
            - pigmentation
          - type: 'null'
        functional_scores:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              score:
                type: number
              pass:
                type: boolean
          description: Per function, the model score and whether it met the threshold. The primary is always present; secondaries are recorded only.
        antimicrobial_probability:
          anyOf:
          - type: number
          - type: 'null'
        molecular_weight:
          anyOf:
          - type: number
          - type: 'null'
          description: Daltons, including the modification shifts.
        net_charge:
          anyOf:
          - type: number
          - type: 'null'
        hydrophobic_moment:
          anyOf:
          - type: number
          - type: 'null'
        physchem_flags:
          type: array
          items:
            type: string
        physchem_flag_count:
          anyOf:
          - type: integer
          - type: 'null'
        aggregation_tendency:
          anyOf:
          - type: number
          - type: 'null'
        solubility:
          anyOf:
          - type: number
          - type: 'null'
        irritation_tier:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
          - type: 'null'
        irritation_score:
          anyOf:
          - type: number
          - type: 'null'
        # penetration_passed: boolean or null
        #   REMINDER, do not delete: the penetration filter is commented out in Stage 8 (no penetration model yet).
        #   The rule result is recorded under predictions.penetration but does not reject. Restore this field, and the
        #   reject in Stage 8, when a penetration model exists (see docs/TODO.md and docs/LIMITATIONS.md).
        skin_sensitizer:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True when the skin sensitization probability is at or above 0.55 (fixed). Only a kept candidate can be true, when `reject_skin_sensitizers` is false.
        skin_sensitization_probability:
          anyOf:
          - type: number
          - type: 'null'
        hemolysis_probability:
          anyOf:
          - type: number
          - type: 'null'
        cytotoxicity:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              p_cytotoxic:
                type: number
              requested:
                type: string
                description: The cell type name asked for in the stage params.
              exact:
                type: boolean
                description: False when the model did not offer the requested name and used the closest label.
          description: Keyed by the cell type the model used. Empty when cytotoxicity did not run.
        half_life_log10_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: Null when the sequence is outside the model's 5-50 residue range.
        allergenicity_probability:
          anyOf:
          - type: number
          - type: 'null'
          description: Null for sequences under 50 residues (not screened).
        cleavage_stability:
          anyOf:
          - type: number
          - type: 'null'
        safety_flags:
          type: array
          items:
            type: string
        synthesis_feasibility_probability:
          anyOf:
          - type: number
          - type: 'null'
        synthesis_flags:
          type: array
          items:
            type: string
          description: Rule flags that never reject, e.g. aspartimide_risk and met_trp_cleavage_oxidation.

