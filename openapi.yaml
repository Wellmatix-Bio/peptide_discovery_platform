    E2ERequest:
      type: object
      additionalProperties: false
      required:
      - s01_therapeutic_product_brief
      - s04_candidate_generation
      - s05_physchem_screening
      - s06_functional_models
      - s07_structure_mechanism
      - s08_safety_developability
      - s09_synthesis_cmc
      properties:
        s01_therapeutic_product_brief:
          $ref: '#/components/schemas/Stage1Request'
        s04_candidate_generation:
          $ref: '#/components/schemas/Stage4Request'
        s05_physchem_screening:
          $ref: '#/components/schemas/Stage5Request'
        s06_functional_models:
          $ref: '#/components/schemas/Stage6Request'
        s07_structure_mechanism:
          $ref: '#/components/schemas/Stage7Request'
        s08_safety_developability:
          $ref: '#/components/schemas/Stage8Request'
        s09_synthesis_cmc:
          $ref: '#/components/schemas/Stage9Request'
      description: >-
        One field per client-configurable stage, each stage's own params
        flattened together with its `enabled` flag (no a nested params wrapper).
        Every field is required to be present -- a bare {} accepts that
        stage's defaults, but omitting the key entirely is a 422. Extra keys
        anywhere in the request, including unrecognized per-stage keys, are
        also a 422. s02_wound_biology_and_targets, s03_data_integration, and
        s11_ranking are deliberately absent -- the server always overrides
        them itself (s02/s03 force-disabled, s11 always uses its built-in
        ranking policy), so a client including any of them is rejected rather
        than silently ignored.
    ErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
      description: Body shape for every manually-raised HTTPException in this
        API (404/422/502/503 responses raised from inside a route handler).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
      description: Body shape FastAPI returns automatically when the request
        body fails schema validation (e.g. a missing required field, a wrong
        type, or an extra key) before the route handler ever runs. Distinct
        from ErrorResponse, which covers errors the handler raises itself.
