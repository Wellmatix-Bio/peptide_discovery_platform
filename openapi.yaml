    CosmeticBrief:
      type: object
      additionalProperties: false
      title: CosmeticBrief
      description: Stage 1 brief for cosmetics and skin beauty. Every field has a default, so an empty brief is valid. `target_depth` is filled from the primary function when omitted. `safety_level` is derived (strict for the eye area or sensitive skin) and is never supplied.
      properties:
        functions:
          type: object
          additionalProperties: false
          properties:
            primary:
              type: string
              enum:
              - collagen_ecm
              - antioxidant
              - pigmentation
              default: collagen_ecm
            secondary:
              type: array
              maxItems: 2
              uniqueItems: true
              items:
                type: string
                enum:
                - collagen_ecm
                - antioxidant
                - pigmentation
              default: []
              description: Up to two functions; must not include the primary.
          default: {}
        target_depth:
          type: string
          enum:
          - outer_layer
          - epidermis
          - dermis
          description: Skin layer the peptide must reach. Omitted, it is set from the primary function (collagen_ecm dermis, antioxidant epidermis, pigmentation epidermis).
        application:
          type: object
          additionalProperties: false
          properties:
            area:
              type: string
              enum:
              - face
              - eye_area
              - body
              default: face
            sensitive_skin:
              type: boolean
              default: false
          default: {}
        product:
          type: object
          additionalProperties: false
          properties:
            ph:
              type: number
              minimum: 4.0
              maximum: 7.5
              default: 5.5
          default: {}
        peptide:
          type: object
          additionalProperties: false
          properties:
            min_length:
              type: integer
              minimum: 6
              maximum: 20
              default: 6
              description: Shortest peptide, in residues. Floor is 6.
            max_length:
              type: integer
              minimum: 6
              maximum: 20
              default: 12
              description: Longest peptide, in residues. Must be at least `min_length`.
          default: {}
      default: {}

